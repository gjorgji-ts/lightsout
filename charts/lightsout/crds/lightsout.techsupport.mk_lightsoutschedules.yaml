---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: lightsoutschedules.lightsout.techsupport.mk
spec:
  group: lightsout.techsupport.mk
  names:
    kind: LightsOutSchedule
    listKind: LightsOutScheduleList
    plural: lightsoutschedules
    singular: lightsoutschedule
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.upscale
      name: Upscale
      type: string
    - jsonPath: .spec.downscale
      name: Downscale
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LightsOutSchedule is the Schema for the lightsoutschedules API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LightsOutScheduleSpec defines the desired state of LightsOutSchedule
            properties:
              argoCD:
                description: |-
                  ArgoCD enables labeling of ArgoCD Application CRDs during scaling
                  operations to signal downscale state. When nil (omitted), ArgoCD
                  integration is disabled.
                properties:
                  namespace:
                    default: argocd
                    description: Namespace where ArgoCD Application CRDs live.
                    type: string
                  warmupTimeout:
                    default: 10m
                    description: |-
                      WarmupTimeout is how long to keep the warming-up label on ArgoCD Application
                      CRDs after upscale before removing it regardless of pod readiness.
                      This prevents ArgoCD alerts from firing while pods are starting up.
                      Defaults to 10 minutes.
                    type: string
                type: object
              customResourceWarmupTimeout:
                default: 10m
                description: |-
                  CustomResourceWarmupTimeout bounds how long upscale waits for restored
                  custom resources to report ready before scaling application workloads up
                  anyway. Only applies when CustomResources is set. Defaults to 10 minutes.
                type: string
              customResources:
                description: |-
                  CustomResources turns operator-managed custom resources off during the
                  downscale window and restores them on upscale. Each entry names one kind
                  and the fields to set on it.

                  Custom resources are turned off before workloads are scaled down, and
                  restored before workloads are scaled up, so databases and message brokers
                  are on their way back before the applications that depend on them start.
                items:
                  description: |-
                    CustomResourceConfig declares how to turn one kind of operator-managed custom
                    resource off during the downscale window.

                    Workloads created by an operator carry a controller owner reference and are
                    skipped by the scaler (see IncludeOwnedWorkloads), because the operator would
                    simply reconcile their replica count back. Turning the operator's own custom
                    resource off is the supported way to stop them.
                  properties:
                    delete:
                      description: |-
                        Delete removes matching resources on downscale instead of patching them,
                        relying on the owning operator to recreate them on upscale. This exists
                        for operators that offer no off switch, such as Strimzi, where the
                        documented way to stop a Kafka cluster is to pause reconciliation and
                        delete the StrimziPodSet resources.

                        Nothing is restored on upscale: recreating the resource is the operator's
                        job once it resumes reconciling. Entries are processed in declaration
                        order, so the entry that pauses the operator must come before the entry
                        that deletes what it manages.

                        Only use this for resources the owning operator rebuilds from a durable
                        spec. Deleting a resource that holds the only copy of its configuration
                        loses it permanently.
                      type: boolean
                    group:
                      description: |-
                        Group is the API group of the custom resource, for example
                        "postgresql.cnpg.io". Empty means the core group.
                      type: string
                    kind:
                      description: Kind is the kind of the custom resource, for example
                        "Cluster".
                      minLength: 1
                      type: string
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: MatchLabels narrows which resources of this kind
                        are targeted.
                      type: object
                    name:
                      description: |-
                        Name targets a single resource by name. When empty, every resource of
                        this kind in the schedule's target namespaces is targeted.
                      type: string
                    setFields:
                      description: SetFields are applied on downscale and reverted
                        on upscale.
                      items:
                        description: |-
                          FieldPatch sets a single field on a custom resource during downscale.
                          The field's previous value is captured so upscale can restore it exactly,
                          which matters for replica counts whose desired value lives in Git rather
                          than in the schedule.
                        properties:
                          path:
                            description: |-
                              Path is an RFC 6901 JSON Pointer to the field, for example
                              "/spec/replicas" or "/metadata/annotations/cnpg.io~1hibernation"
                              ("~1" escapes a literal "/" inside a segment, "~0" a literal "~").

                              A "*" segment matches every element of an array or every key of an
                              object, so "/spec/nodeSets/*/count" targets every node set without
                              depending on their order.
                            minLength: 2
                            pattern: ^/.*$
                            type: string
                          value:
                            description: Value is the value written to Path during
                              downscale.
                            x-kubernetes-preserve-unknown-fields: true
                        required:
                        - path
                        - value
                        type: object
                      type: array
                    version:
                      description: Version is the API version of the custom resource,
                        for example "v1".
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - version
                  type: object
                type: array
              downscale:
                description: Downscale is the cron expression for when to scale workloads
                  down
                minLength: 1
                type: string
              downscaleRateLimit:
                description: |-
                  DownscaleRateLimit configures rate limiting when scaling down.
                  If not set, all workloads are scaled down at once.
                properties:
                  batchSize:
                    description: |-
                      BatchSize is the number of workloads to process before waiting.
                      If not set, all workloads are processed at once (no rate limiting).
                    minimum: 1
                    type: integer
                  delayBetweenBatches:
                    description: |-
                      DelayBetweenBatches is the duration to wait between batches.
                      Only applies when BatchSize is set.
                    type: string
                type: object
              excludeLabels:
                description: ExcludeLabels skips workloads matching these labels
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              excludeNamespaces:
                description: ExcludeNamespaces is a list of namespaces to exclude
                  from management
                items:
                  type: string
                type: array
              fluxCD:
                description: |-
                  FluxCD enables suspension of FluxCD Kustomization and HelmRelease resources
                  during scaling operations to prevent reconciliation from fighting scale-down.
                  When nil (omitted), FluxCD integration is disabled.
                properties:
                  namespace:
                    default: flux-system
                    description: |-
                      Namespace excluded from the co-located resource search. Resources in this
                      namespace without spec.targetNamespace are skipped because they are system
                      resources, not co-located workload deployments. Defaults to flux-system.
                    type: string
                  warmupTimeout:
                    default: 10m
                    description: |-
                      WarmupTimeout is how long to keep Flux resources suspended after upscale
                      before resuming them regardless of pod readiness.
                      Defaults to 10 minutes.
                    type: string
                type: object
              includeOwnedWorkloads:
                default: false
                description: |-
                  IncludeOwnedWorkloads allows scaling workloads that are controlled by
                  another controller (they carry a controller owner reference, e.g. a
                  StatefulSet created by a database operator from its own CRD).

                  By default these are skipped: the owning controller reconciles the replica
                  count back from its custom resource, so lightsout would scale the workload
                  to zero only to have it restored, while its own annotations make subsequent
                  reconciles treat it as already scaled down.

                  Set this to true only when the owning controller has been paused by other
                  means (for example an operator-specific pause or suspend annotation), so
                  nothing will fight the scaling.
                type: boolean
              namespaceSelector:
                description: NamespaceSelector selects namespaces by label
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              namespaces:
                description: Namespaces is an explicit list of namespace names to
                  manage
                items:
                  type: string
                type: array
              suspend:
                default: false
                description: Suspend pauses all scaling operations when true
                type: boolean
              timezone:
                default: UTC
                description: Timezone is the IANA timezone for interpreting cron expressions
                type: string
              upscale:
                description: Upscale is the cron expression for when to scale workloads
                  up
                minLength: 1
                type: string
              upscaleRateLimit:
                description: |-
                  UpscaleRateLimit configures rate limiting when scaling up.
                  If not set, all workloads are scaled up at once.
                properties:
                  batchSize:
                    description: |-
                      BatchSize is the number of workloads to process before waiting.
                      If not set, all workloads are processed at once (no rate limiting).
                    minimum: 1
                    type: integer
                  delayBetweenBatches:
                    description: |-
                      DelayBetweenBatches is the duration to wait between batches.
                      Only applies when BatchSize is set.
                    type: string
                type: object
              workloadTypes:
                description: |-
                  WorkloadTypes specifies which workload types to manage
                  If empty, all types are managed (Deployment, StatefulSet, CronJob)
                items:
                  description: WorkloadType represents a type of Kubernetes workload
                  enum:
                  - Deployment
                  - StatefulSet
                  - CronJob
                  type: string
                type: array
            required:
            - downscale
            - upscale
            type: object
          status:
            description: LightsOutScheduleStatus defines the observed state of LightsOutSchedule
            properties:
              conditions:
                description: Conditions represent the current state of the schedule
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastDownscaleTime:
                description: LastDownscaleTime is the last time workloads were scaled
                  down
                format: date-time
                type: string
              lastUpscaleTime:
                description: LastUpscaleTime is the last time workloads were scaled
                  up
                format: date-time
                type: string
              namespaces:
                description: Namespaces is the list of namespaces currently being
                  managed
                items:
                  type: string
                type: array
              nextDownscaleTime:
                description: NextDownscaleTime is the next scheduled downscale time
                format: date-time
                type: string
              nextUpscaleTime:
                description: NextUpscaleTime is the next scheduled upscale time
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the controller
                format: int64
                type: integer
              scalingProgress:
                description: |-
                  ScalingProgress shows progress during batched scaling operations.
                  Only present while scaling is in progress.
                properties:
                  completed:
                    description: Completed is the number of workloads successfully
                      scaled
                    type: integer
                  failed:
                    description: Failed is the number of workloads that failed to
                      scale
                    type: integer
                  inProgress:
                    description: InProgress indicates whether scaling is currently
                      in progress
                    type: boolean
                  total:
                    description: Total number of workloads to scale
                    type: integer
                required:
                - completed
                - failed
                - inProgress
                - total
                type: object
              state:
                description: State is the current scaling state (Up, Down, or Unknown)
                enum:
                - Up
                - Down
                - Unknown
                type: string
              stuckTerminatingPods:
                description: |-
                  StuckTerminatingPods counts pods that are still running well past their
                  termination grace period after a downscale. Scaling a workload to zero only
                  writes the spec, so a pod the kubelet cannot kill keeps its node alive while
                  this schedule reports Down. A non-zero value means the namespace did not
                  release the compute it was scaled down to release.
                type: integer
              workloadStats:
                description: WorkloadStats contains statistics about managed workloads
                properties:
                  cronjobsManaged:
                    description: CronJobsManaged is the total number of cronjobs being
                      managed
                    type: integer
                  cronjobsSuspended:
                    description: CronJobsSuspended is the number of cronjobs currently
                      suspended by us
                    type: integer
                  deploymentsManaged:
                    description: DeploymentsManaged is the total number of deployments
                      being managed
                    type: integer
                  deploymentsScaled:
                    description: DeploymentsScaled is the number of deployments currently
                      scaled to 0
                    type: integer
                  statefulsetsManaged:
                    description: StatefulSetsManaged is the total number of statefulsets
                      being managed
                    type: integer
                  statefulsetsScaled:
                    description: StatefulSetsScaled is the number of statefulsets
                      currently scaled to 0
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
