{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "lightsout.fullname" . }}
  labels:
    {{- include "lightsout.labels" . | nindent 4 }}
rules:
  # LightsOutSchedule resources
  - apiGroups:
      - lightsout.techsupport.mk
    resources:
      - lightsoutschedules
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - lightsout.techsupport.mk
    resources:
      - lightsoutschedules/finalizers
    verbs:
      - update
  - apiGroups:
      - lightsout.techsupport.mk
    resources:
      - lightsoutschedules/status
    verbs:
      - get
      - patch
      - update
  # Namespaces
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  # Deployments and StatefulSets
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  {{- if .Values.rbac.argocd }}
  # ArgoCD Applications
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  {{- end }}
  {{- if .Values.rbac.fluxcd }}
  # FluxCD Kustomizations
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # FluxCD HelmReleases
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  {{- end }}
  # HorizontalPodAutoscalers
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # CronJobs
  - apiGroups:
      - batch
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # Events (core API group, legacy)
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Events (events.k8s.io API group, used by controller-runtime's event broadcaster)
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  {{- if .Values.namespaceSchedules.enabled }}
  # LightsOutNamespaceSchedule resources
  - apiGroups:
      - lightsout.techsupport.mk
    resources:
      - lightsoutnamespaceschedules
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - lightsout.techsupport.mk
    resources:
      - lightsoutnamespaceschedules/finalizers
    verbs:
      - update
  - apiGroups:
      - lightsout.techsupport.mk
    resources:
      - lightsoutnamespaceschedules/status
    verbs:
      - get
      - patch
      - update
  {{- end }}
---
# Leader election role (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lightsout.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lightsout.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
{{- end }}
