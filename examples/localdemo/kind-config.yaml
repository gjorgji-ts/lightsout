kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    # The demo runs about 90 pods across 21 namespaces, and the monitoring stack
    # adds its own. The kubelet default of 110 is too low for that.
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        maxPods: 250
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
