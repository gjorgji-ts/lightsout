# sleepy-hollow - managed by batch-offhours (cluster-scoped)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headless-horseman
  namespace: sleepy-hollow
  labels:
    app: headless-horseman
spec:
  replicas: 2
  selector:
    matchLabels:
      app: headless-horseman
  template:
    metadata:
      labels:
        app: headless-horseman
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pumpkin-carver
  namespace: sleepy-hollow
  labels:
    app: pumpkin-carver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pumpkin-carver
  template:
    metadata:
      labels:
        app: pumpkin-carver
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: haunted-ledger
  namespace: sleepy-hollow
  labels:
    app: haunted-ledger
spec:
  serviceName: haunted-ledger
  replicas: 2
  selector:
    matchLabels:
      app: haunted-ledger
  template:
    metadata:
      labels:
        app: haunted-ledger
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: midnight-ride
  namespace: sleepy-hollow
  labels:
    app: midnight-ride
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: work
              image: busybox:latest
              command: ["sh", "-c", "echo 'working...' && sleep 3 && echo 'done.'"]
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 16Mi
          restartPolicy: OnFailure
