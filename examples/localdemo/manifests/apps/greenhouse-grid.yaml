# greenhouse-grid - managed by iot-offhours (namespace-scoped)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-sink
  namespace: greenhouse-grid
  labels:
    app: sensor-sink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sensor-sink
  template:
    metadata:
      labels:
        app: sensor-sink
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reading-store
  namespace: greenhouse-grid
  labels:
    app: reading-store
spec:
  serviceName: reading-store
  replicas: 2
  selector:
    matchLabels:
      app: reading-store
  template:
    metadata:
      labels:
        app: reading-store
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: watering-can
  namespace: greenhouse-grid
  labels:
    app: watering-can
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: work
              image: busybox:latest
              command: ["sh", "-c", "echo 'working...' && sleep 3 && echo 'done.'"]
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 16Mi
          restartPolicy: OnFailure
