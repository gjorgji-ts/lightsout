# understudy-stage - managed by staging-offhours (cluster-scoped)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stand-in
  namespace: understudy-stage
  labels:
    app: stand-in
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stand-in
  template:
    metadata:
      labels:
        app: stand-in
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prompt-book
  namespace: understudy-stage
  labels:
    app: prompt-book
spec:
  serviceName: prompt-book
  replicas: 2
  selector:
    matchLabels:
      app: prompt-book
  template:
    metadata:
      labels:
        app: prompt-book
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
