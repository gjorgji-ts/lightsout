# neon-arcade - managed by platform-offhours (cluster-scoped)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinball-wizard
  namespace: neon-arcade
  labels:
    app: pinball-wizard
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pinball-wizard
  template:
    metadata:
      labels:
        app: pinball-wizard
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-machine
  namespace: neon-arcade
  labels:
    app: claw-machine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claw-machine
  template:
    metadata:
      labels:
        app: claw-machine
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-score-board
  namespace: neon-arcade
  labels:
    app: high-score-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: high-score-board
  template:
    metadata:
      labels:
        app: high-score-board
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: always-on-sign
  namespace: neon-arcade
  labels:
    app: always-on-sign
    lights: always-on
spec:
  replicas: 1
  selector:
    matchLabels:
      app: always-on-sign
  template:
    metadata:
      labels:
        app: always-on-sign
        lights: always-on
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coin-counter
  namespace: neon-arcade
  labels:
    app: coin-counter
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: work
              image: busybox:latest
              command: ["sh", "-c", "echo 'working...' && sleep 3 && echo 'done.'"]
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 16Mi
          restartPolicy: OnFailure
