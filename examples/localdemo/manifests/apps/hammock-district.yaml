# hammock-district - managed by platform-offhours, until sandbox-offhours adopts it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hammock-weaver
  namespace: hammock-district
  labels:
    app: hammock-weaver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hammock-weaver
  template:
    metadata:
      labels:
        app: hammock-weaver
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nap-ledger
  namespace: hammock-district
  labels:
    app: nap-ledger
spec:
  serviceName: nap-ledger
  replicas: 2
  selector:
    matchLabels:
      app: nap-ledger
  template:
    metadata:
      labels:
        app: nap-ledger
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
