# goldfish-memory - managed by cache-offhours (namespace-scoped)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-warmer
  namespace: goldfish-memory
  labels:
    app: cache-warmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-warmer
  template:
    metadata:
      labels:
        app: cache-warmer
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recall-node
  namespace: goldfish-memory
  labels:
    app: recall-node
spec:
  serviceName: recall-node
  replicas: 2
  selector:
    matchLabels:
      app: recall-node
  template:
    metadata:
      labels:
        app: recall-node
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
