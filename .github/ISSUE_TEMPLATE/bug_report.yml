name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the [existing issues](https://github.com/gjorgji-ts/lightsout/issues) to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: LightsOut version
      placeholder: "e.g. v0.12.3"
    validations:
      required: true

  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      placeholder: "e.g. v1.29.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Apply this LightsOutSchedule manifest …
        2. …
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or events
      description: "`kubectl logs -n lightsout-system deploy/lightsout-controller-manager` and/or `kubectl describe lightsoutschedule <name>`"
      render: shell

  - type: textarea
    id: manifest
    attributes:
      label: LightsOutSchedule manifest (if applicable)
      render: yaml
