name: Bug report
description: Something does not work the way the docs say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [open issues](https://github.com/gjorgji-ts/lightsout/issues) first, to avoid a duplicate.

        Do not report a security vulnerability here. Use a [private advisory](https://github.com/gjorgji-ts/lightsout/security/advisories/new) instead.

  - type: input
    id: version
    attributes:
      label: LightsOut version
      placeholder: "v0.18.0"
    validations:
      required: true

  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes version
      placeholder: "v1.37.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Helm chart, webhooks enabled
        - Helm chart, webhooks disabled
        - Kustomize
        - Other
    validations:
      required: true

  - type: checkboxes
    id: integrations
    attributes:
      label: Which integrations were active?
      description: Tick the fields set on the schedule. Leave all empty if the schedule scales workloads only.
      options:
        - label: "`spec.argoCD`"
        - label: "`spec.fluxCD`"
        - label: "`spec.customResources`"
        - label: "`spec.includeOwnedWorkloads`"
        - label: An HPA targets the affected workload

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Apply this LightsOutSchedule.
        2. Wait for the downscale.
        3. …
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: The schedule
      description: The `LightsOutSchedule` or `LightsOutNamespaceSchedule` that shows the problem. Remove anything private.
      render: yaml

  - type: textarea
    id: status
    attributes:
      label: Schedule status
      description: Output of `kubectl describe lightsoutschedule NAME`. The status and the events carry most of the answer.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Controller logs
      description: Output of `kubectl logs -n lightsout-system deploy/lightsout-controller-manager`.
      render: shell
