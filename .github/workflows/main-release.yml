name: Main - Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build-test-lint:
    uses: ./.github/workflows/build-test-lint.yml
    permissions:
      contents: read

  release:
    needs: [build-test-lint]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for cosign keyless signing
      packages: write # for pushing to GHCR
      contents: write # for creating GitHub releases

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate version
        id: version
        uses: PaulHatch/semantic-version@79147b94804704a613626766998afe7b2bd0bb47 # v6.0.5
        with:
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          version_format: "${major}.${minor}.${patch}"
          change_path: "cmd api internal charts config Dockerfile go.mod go.sum .goreleaser.yml"

      - name: Check if version changed
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git tag "v${VERSION}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git" "v${VERSION}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.check.outputs.skip == 'false'
        with:
          go-version-file: "go.mod"
          cache: true
          cache-dependency-path: go.sum

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.check.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.check.outputs.skip == 'false'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.check.outputs.skip == 'false'

      - name: Install Syft
        if: steps.check.outputs.skip == 'false'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Login to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        if: steps.check.outputs.skip == 'false'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          GORELEASER_CURRENT_TAG: "v${{ steps.version.outputs.version }}"

      - name: Install Helm
        if: steps.check.outputs.skip == 'false'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Package and Push Helm Chart
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          CHART_NAME=lightsout

          helm package ./charts/$CHART_NAME --version "$VERSION"

          helm registry login ghcr.io \
            --username "$ACTOR" \
            --password "$TOKEN"

          helm push ./$CHART_NAME-$VERSION.tgz \
            "oci://ghcr.io/$OWNER/charts"

      - name: Install crane
        if: steps.check.outputs.skip == 'false'
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      - name: Tag Helm Chart as latest
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          crane auth login ghcr.io \
            --username "$ACTOR" \
            --password "$TOKEN"
          crane tag "ghcr.io/$OWNER/charts/lightsout:$VERSION" latest
